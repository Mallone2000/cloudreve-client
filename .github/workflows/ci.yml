name: CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ui/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ui/**'
      - '.github/workflows/ci.yml'

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
      - name: Install Yarn
        run: npm install -g yarn
      - name: Install dependencies
        working-directory: ui
        run: yarn install --frozen-lockfile
      - name: Lint
        working-directory: ui
        run: yarn lint
      - name: Type-check and build
        working-directory: ui
        run: yarn build

  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: '. -> target'

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config

      - name: Run tests
        run: cargo test --locked -p cloudreve-sync -p cloudreve-api

      - name: Benchmark 1,000-file recovery
        run: cargo test --locked -p cloudreve-sync --test reconciliation_benchmark recovery_1000_files -- --ignored --exact --nocapture

      - name: Benchmark 10,000-file recovery
        run: cargo test --locked -p cloudreve-sync --test reconciliation_benchmark recovery_10000_files -- --ignored --exact --nocapture

      - name: Check desktop crate compiles
        # The frontend job builds the UI; this job checks the Rust desktop crate.
        run: |
          mkdir -p ui/dist
          cargo check --locked -p cloudreve-desktop

      - name: Test desktop security configuration
        run: cargo test --locked -p cloudreve-desktop --lib
